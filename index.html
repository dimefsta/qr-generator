<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>QR Code Generator — Fast, Modern & Responsive</title>
  <meta name="description" content="A modern, mobile-first QR code generator. Generate, customize, and export crisp QR codes as PNG or PDF instantly.">
  <!-- Security Headers -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:;">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Main Application Card -->
  <main class="app-card" role="main">
    
    <!-- Header Section -->
    <header class="app-header">
      <div class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"></rect>
          <rect x="14" y="3" width="7" height="7"></rect>
          <rect x="14" y="14" width="7" height="7"></rect>
          <rect x="3" y="14" width="7" height="7"></rect>
        </svg>
      </div>
      <h1 class="app-title">QR Generator</h1>
      <p class="app-subtitle">Create clean, high-resolution QR codes ready to download or copy.</p>
    </header>

    <!-- Generator Form -->
    <form class="qr-form" id="qr-form" novalidate>
      <div class="form-group">
        <label for="url-input" class="form-label">
          <span>Enter URL or Content</span>
        </label>
        
        <div class="input-wrapper">
          <span class="input-icon-left" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
              <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
            </svg>
          </span>
          <input 
            type="text" 
            id="url-input" 
            name="content"
            class="text-input" 
            placeholder="e.g., https://example.com" 
            autocomplete="off"
            spellcheck="false"
            inputmode="url"
            enterkeyhint="go"
            aria-describedby="input-error-msg"
            required
          >
          <button 
            type="button" 
            id="clear-btn" 
            class="clear-btn" 
            aria-label="Clear input field" 
            tabindex="-1"
          >
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
        <div id="input-error-msg" class="error-msg" role="alert" aria-live="polite">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          <span>Please enter valid content or URL.</span>
        </div>
      </div>

      <button type="submit" id="generate-btn" class="btn btn-primary btn-generate">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
        </svg>
        <span>Generate QR Code</span>
      </button>
    </form>

    <!-- QR Output & Actions Section -->
    <section class="qr-preview-section" id="preview-section" aria-label="Generated QR Code Preview">
      <div class="qr-frame">
        <div class="qr-canvas-container" id="qr-container">
          <canvas id="qr-code" role="img" aria-label="QR Code graphic"></canvas>
        </div>
        <p class="qr-caption" id="qr-caption"></p>
      </div>

      <!-- Action Buttons Grid -->
      <div class="action-grid" id="action-grid">
        <button type="button" id="download-png-btn" class="btn btn-secondary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          <span>PNG Image</span>
        </button>

        <button type="button" id="download-pdf-btn" class="btn btn-secondary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
          <span>PDF Document</span>
        </button>

        <button type="button" id="copy-btn" class="btn btn-secondary btn-full">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
          <span>Copy Image to Clipboard</span>
        </button>
      </div>
    </section>
  </main>

  <!-- Interactive Feedback Toast -->
  <div id="toast" class="toast-container" role="status" aria-live="polite">
    <span class="toast-icon" id="toast-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
        <polyline points="22 4 12 14.01 9 11.01"></polyline>
      </svg>
    </span>
    <span id="toast-text">Message</span>
  </div>

  <!-- Local Vendor Dependencies (Offline, Supply-Chain Secure) -->
  <script src="vendor/qrious.min.js"></script>
  <script src="vendor/jspdf.umd.min.js"></script>
  <!-- Application Script -->
  <script src="script.js"></script>
</body>
</html>

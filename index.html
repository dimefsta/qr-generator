<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>QR Code Generator — Fast, Modern & Responsive</title>
  <meta name="description" content="A modern, mobile-first QR code generator. Generate, customize, and export crisp QR codes as PNG or PDF instantly.">

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       CSS Custom Properties / Design Tokens
       ========================================================================== */
    :root {
      /* Colors */
      --color-primary: #4f46e5;
      --color-primary-hover: #4338ca;
      --color-primary-active: #3730a3;
      --color-primary-light: #eef2ff;
      --color-primary-focus: rgba(79, 70, 229, 0.25);

      --color-bg-base: #f8fafc;
      --color-bg-card: #ffffff;
      --color-bg-subtle: #f1f5f9;
      --color-bg-hover: #e2e8f0;

      --color-text-main: #0f172a;
      --color-text-muted: #64748b;
      --color-text-subtle: #94a3b8;
      --color-text-inverse: #ffffff;

      --color-border: #e2e8f0;
      --color-border-hover: #cbd5e1;
      --color-border-focus: #4f46e5;

      --color-error: #ef4444;
      --color-error-bg: #fef2f2;
      --color-error-border: #fecaca;
      --color-success: #10b981;
      --color-success-bg: #ecfdf5;

      /* Typography */
      --font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-size-xs: 0.75rem;
      --font-size-sm: 0.875rem;
      --font-size-base: 1rem;
      --font-size-lg: 1.125rem;
      --font-size-xl: 1.25rem;
      --font-size-2xl: 1.5rem;

      /* Spacing */
      --spacing-xs: 0.25rem;
      --spacing-sm: 0.5rem;
      --spacing-md: 0.75rem;
      --spacing-lg: 1rem;
      --spacing-xl: 1.5rem;
      --spacing-2xl: 2rem;

      /* Border Radii */
      --radius-sm: 0.375rem;
      --radius-md: 0.625rem;
      --radius-lg: 0.875rem;
      --radius-xl: 1.25rem;
      --radius-full: 9999px;

      /* Shadows */
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.04);
      --shadow-xl: 0 20px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04);

      /* Transitions */
      --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
      --transition-normal: 250ms cubic-bezier(0.4, 0, 0.2, 1);

      /* Layout */
      --min-touch-target: 48px;
    }

    /* ==========================================================================
       Reset & Base Styles
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      font-size: 16px;
      -webkit-text-size-adjust: 100%;
      height: 100%;
    }

    body {
      font-family: var(--font-family);
      font-size: var(--font-size-base);
      line-height: 1.5;
      color: var(--color-text-main);
      background-color: var(--color-bg-base);
      background-image:
        radial-gradient(at 0% 0%, rgba(79, 70, 229, 0.06) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.05) 0px, transparent 50%);
      background-attachment: fixed;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: var(--spacing-lg);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Accessible visually hidden class */
    .visually-hidden {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      padding: 0 !important;
      margin: -1px !important;
      overflow: hidden !important;
      clip: rect(0, 0, 0, 0) !important;
      white-space: nowrap !important;
      border: 0 !important;
    }

    /* ==========================================================================
       Card Container
       ========================================================================== */
    .app-card {
      background-color: var(--color-bg-card);
      width: 100%;
      max-width: 440px;
      border-radius: var(--radius-xl);
      padding: clamp(1.25rem, 5vw, 2rem);
      box-shadow: var(--shadow-xl);
      border: 1px solid var(--color-border);
      transition: transform var(--transition-normal), box-shadow var(--transition-normal);
      display: flex;
      flex-direction: column;
      gap: var(--spacing-lg);
    }

    /* ==========================================================================
       Header
       ========================================================================== */
    .app-header {
      text-align: center;
    }

    .brand-icon {
      width: 48px;
      height: 48px;
      margin: 0 auto var(--spacing-sm);
      background-color: var(--color-primary-light);
      color: var(--color-primary);
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-sm);
    }

    .brand-icon svg {
      width: 26px;
      height: 26px;
    }

    .app-title {
      font-size: clamp(1.35rem, 4vw, 1.625rem);
      font-weight: 700;
      color: var(--color-text-main);
      letter-spacing: -0.025em;
      margin-bottom: var(--spacing-xs);
    }

    .app-subtitle {
      font-size: var(--font-size-sm);
      color: var(--color-text-muted);
      line-height: 1.4;
    }

    /* ==========================================================================
       Form & Inputs
       ========================================================================== */
    .qr-form {
      display: flex;
      flex-direction: column;
      gap: var(--spacing-md);
      width: 100%;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: var(--spacing-xs);
      position: relative;
    }

    .form-label {
      font-size: var(--font-size-sm);
      font-weight: 600;
      color: var(--color-text-main);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
    }

    .input-icon-left {
      position: absolute;
      left: 0.875rem;
      color: var(--color-text-subtle);
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .input-icon-left svg {
      width: 18px;
      height: 18px;
    }

    .text-input {
      width: 100%;
      min-height: var(--min-touch-target);
      font-family: inherit;
      font-size: var(--font-size-base); /* >= 16px prevents iOS Safari auto-zoom */
      color: var(--color-text-main);
      background-color: var(--color-bg-base);
      border: 1.5px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: 0.75rem 2.5rem 0.75rem 2.625rem;
      transition: border-color var(--transition-fast), background-color var(--transition-fast), box-shadow var(--transition-fast);
      outline: none;
      -webkit-appearance: none;
      appearance: none;
    }

    .text-input::placeholder {
      color: var(--color-text-subtle);
      font-size: var(--font-size-sm);
    }

    .text-input:hover {
      border-color: var(--color-border-hover);
    }

    .text-input:focus {
      border-color: var(--color-border-focus);
      background-color: var(--color-bg-card);
      box-shadow: 0 0 0 3px var(--color-primary-focus);
    }

    .text-input.input-error {
      border-color: var(--color-error);
      background-color: var(--color-error-bg);
      animation: shake 0.3s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }

    .text-input.input-error:focus {
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.2);
    }

    /* Clear input button */
    .clear-btn {
      position: absolute;
      right: 0.5rem;
      background: none;
      border: none;
      padding: 0.5rem;
      color: var(--color-text-subtle);
      border-radius: var(--radius-full);
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      min-width: 36px;
      min-height: 36px;
      transition: color var(--transition-fast), background-color var(--transition-fast);
    }

    .clear-btn:hover {
      color: var(--color-text-main);
      background-color: var(--color-bg-hover);
    }

    .clear-btn.visible {
      display: flex;
    }

    /* Error Message */
    .error-msg {
      font-size: var(--font-size-xs);
      color: var(--color-error);
      font-weight: 500;
      min-height: 1.125rem;
      display: flex;
      align-items: center;
      gap: 0.375rem;
      opacity: 0;
      transform: translateY(-4px);
      transition: opacity var(--transition-fast), transform var(--transition-fast);
    }

    .error-msg.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* ==========================================================================
       Buttons
       ========================================================================== */
    .btn {
      min-height: var(--min-touch-target);
      padding: 0.75rem 1.25rem;
      font-family: inherit;
      font-size: var(--font-size-base);
      font-weight: 600;
      border-radius: var(--radius-md);
      border: 1px solid transparent;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      text-decoration: none;
      transition: all var(--transition-fast);
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      position: relative;
      touch-action: manipulation;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn:focus-visible {
      outline: 2px solid var(--color-primary);
      outline-offset: 2px;
    }

    .btn svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .btn-primary {
      background-color: var(--color-primary);
      color: var(--color-text-inverse);
      box-shadow: 0 1px 2px 0 rgba(79, 70, 229, 0.2);
    }

    .btn-primary:hover {
      background-color: var(--color-primary-hover);
      box-shadow: 0 4px 8px 0 rgba(79, 70, 229, 0.25);
    }

    .btn-primary:active {
      background-color: var(--color-primary-active);
    }

    .btn-secondary {
      background-color: var(--color-bg-card);
      color: var(--color-text-main);
      border: 1px solid var(--color-border);
      box-shadow: var(--shadow-sm);
    }

    .btn-secondary:hover {
      background-color: var(--color-bg-subtle);
      border-color: var(--color-border-hover);
      color: var(--color-primary);
    }

    .btn-secondary:active {
      background-color: var(--color-bg-hover);
    }

    /* Full width generate button */
    .btn-generate {
      width: 100%;
    }

    /* ==========================================================================
       QR Display Section
       ========================================================================== */
    .qr-preview-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--spacing-lg);
      padding-top: var(--spacing-sm);
      opacity: 0;
      max-height: 0;
      overflow: hidden;
      transition: opacity var(--transition-normal), max-height 400ms ease, padding var(--transition-normal);
      pointer-events: none;
    }

    .qr-preview-section.active {
      opacity: 1;
      max-height: 800px;
      pointer-events: auto;
    }

    .qr-frame {
      background-color: var(--color-bg-base);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: clamp(1rem, 4vw, 1.25rem);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.02);
    }

    .qr-canvas-container {
      background-color: #ffffff;
      padding: 12px;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      border: 1px solid rgba(0, 0, 0, 0.04);
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 260px;
      aspect-ratio: 1 / 1;
    }

    #qr-code {
      display: block;
      width: 100% !important;
      height: 100% !important;
      object-fit: contain;
      border-radius: var(--radius-sm);
    }

    .qr-caption {
      margin-top: var(--spacing-sm);
      font-size: var(--font-size-xs);
      color: var(--color-text-muted);
      text-align: center;
      word-break: break-all;
      max-width: 90%;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* ==========================================================================
       Download / Action Buttons Grid
       ========================================================================== */
    .action-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: var(--spacing-sm);
      width: 100%;
    }

    .action-grid .btn-full {
      grid-column: span 2;
    }

    /* ==========================================================================
       Toast Notification
       ========================================================================== */
    .toast-container {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background-color: var(--color-text-main);
      color: var(--color-text-inverse);
      padding: 0.75rem 1.25rem;
      border-radius: var(--radius-full);
      font-size: var(--font-size-sm);
      font-weight: 500;
      box-shadow: var(--shadow-lg);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      opacity: 0;
      transition: transform var(--transition-normal), opacity var(--transition-normal);
      z-index: 1000;
      pointer-events: none;
      max-width: calc(100% - 2rem);
      white-space: nowrap;
    }

    .toast-container.toast-visible {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .toast-icon {
      display: flex;
      align-items: center;
      color: var(--color-success);
    }

    .toast-icon svg {
      width: 18px;
      height: 18px;
    }

    /* ==========================================================================
       Animations
       ========================================================================== */
    @keyframes shake {
      10%, 90% { transform: translate3d(-1px, 0, 0); }
      20%, 80% { transform: translate3d(2px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-3px, 0, 0); }
      40%, 60% { transform: translate3d(3px, 0, 0); }
    }

    @keyframes fadeInScale {
      from {
        opacity: 0;
        transform: scale(0.95);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .animate-pop {
      animation: fadeInScale 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* ==========================================================================
       Responsive Media Queries
       ========================================================================== */
    @media (max-width: 480px) {
      body {
        padding: 0.75rem;
      }

      .app-card {
        padding: 1.25rem 1rem;
        gap: var(--spacing-md);
        border-radius: var(--radius-lg);
      }

      .action-grid {
        grid-template-columns: 1fr;
      }

      .action-grid .btn-full {
        grid-column: span 1;
      }

      .btn {
        width: 100%;
        font-size: var(--font-size-sm);
      }
    }

    @media (min-width: 481px) and (hover: hover) {
      .app-card:hover {
        box-shadow: 0 25px 30px -5px rgba(15, 23, 42, 0.1), 0 10px 15px -5px rgba(15, 23, 42, 0.04);
      }
    }
  </style>
</head>
<body>

  <!-- Main Application Card -->
  <main class="app-card" role="main">
    
    <!-- Header Section -->
    <header class="app-header">
      <div class="brand-icon" aria-hidden="true">
        <!-- Minimalist QR Icon -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"></rect>
          <rect x="14" y="3" width="7" height="7"></rect>
          <rect x="14" y="14" width="7" height="7"></rect>
          <rect x="3" y="14" width="7" height="7"></rect>
        </svg>
      </div>
      <h1 class="app-title">QR Generator</h1>
      <p class="app-subtitle">Create clean, high-resolution QR codes ready to download or copy.</p>
    </header>

    <!-- Generator Form -->
    <form class="qr-form" id="qr-form" novalidate>
      <div class="form-group">
        <label for="url-input" class="form-label">
          <span>Enter URL or Content</span>
        </label>
        
        <div class="input-wrapper">
          <span class="input-icon-left" aria-hidden="true">
            <!-- Link Icon -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
              <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
            </svg>
          </span>

          <input 
            type="text" 
            id="url-input" 
            name="content"
            class="text-input" 
            placeholder="e.g., https://example.com" 
            autocomplete="off"
            spellcheck="false"
            inputmode="url"
            enterkeyhint="go"
            aria-describedby="input-error-msg"
            required
          >

          <button 
            type="button" 
            id="clear-btn" 
            class="clear-btn" 
            aria-label="Clear input field" 
            tabindex="-1"
          >
            <!-- Close / Clear Icon -->
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>

        <div id="input-error-msg" class="error-msg" role="alert" aria-live="polite">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          <span>Please enter valid content or URL.</span>
        </div>
      </div>

      <button type="submit" id="generate-btn" class="btn btn-primary btn-generate">
        <!-- Sparkle/Generate Icon -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
        </svg>
        <span>Generate QR Code</span>
      </button>
    </form>

    <!-- QR Output & Actions Section -->
    <section class="qr-preview-section" id="preview-section" aria-label="Generated QR Code Preview">
      <div class="qr-frame">
        <div class="qr-canvas-container" id="qr-container">
          <canvas id="qr-code" role="img" aria-label="QR Code graphic"></canvas>
        </div>
        <p class="qr-caption" id="qr-caption"></p>
      </div>

      <!-- Action Buttons Grid -->
      <div class="action-grid" id="action-grid">
        <!-- Download PNG Button -->
        <button type="button" id="download-png-btn" class="btn btn-secondary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          <span>PNG Image</span>
        </button>

        <!-- Download PDF Button -->
        <button type="button" id="download-pdf-btn" class="btn btn-secondary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
          <span>PDF Document</span>
        </button>

        <!-- Copy to Clipboard Button -->
        <button type="button" id="copy-btn" class="btn btn-secondary btn-full">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
          <span>Copy Image to Clipboard</span>
        </button>
      </div>
    </section>

  </main>

  <!-- Interactive Feedback Toast -->
  <div id="toast" class="toast-container" role="status" aria-live="polite">
    <span class="toast-icon" id="toast-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
        <polyline points="22 4 12 14.01 9 11.01"></polyline>
      </svg>
    </span>
    <span id="toast-text">Message</span>
  </div>

  <!-- CDN Dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/qrious@4.0.2/dist/qrious.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <!-- Application Logic -->
  <script>
    (function () {
      'use strict';

      // ==========================================================================
      // DOM Elements Cache
      // ==========================================================================
      const form = document.getElementById('qr-form');
      const input = document.getElementById('url-input');
      const clearBtn = document.getElementById('clear-btn');
      const errorMsg = document.getElementById('input-error-msg');
      const errorMsgText = errorMsg.querySelector('span');
      const previewSection = document.getElementById('preview-section');
      const qrCanvas = document.getElementById('qr-code');
      const qrContainer = document.getElementById('qr-container');
      const qrCaption = document.getElementById('qr-caption');
      const downloadPngBtn = document.getElementById('download-png-btn');
      const downloadPdfBtn = document.getElementById('download-pdf-btn');
      const copyBtn = document.getElementById('copy-btn');
      const toast = document.getElementById('toast');
      const toastText = document.getElementById('toast-text');

      let currentQrInstance = null;
      let toastTimeout = null;

      // ==========================================================================
      // Toast Notification Helper
      // ==========================================================================
      function showToast(message, isError = false) {
        if (toastTimeout) clearTimeout(toastTimeout);
        toastText.textContent = message;
        toast.style.backgroundColor = isError ? 'var(--color-error)' : 'var(--color-text-main)';
        toast.classList.add('toast-visible');

        toastTimeout = setTimeout(() => {
          toast.classList.remove('toast-visible');
        }, 3000);
      }

      // ==========================================================================
      // Validation & URL Normalization
      // ==========================================================================
      function normalizeContent(rawText) {
        const trimmed = rawText.trim();
        if (!trimmed) return '';

        // Auto-prepend https:// if the user typed a web domain pattern without protocol
        const domainPattern = /^(?:www\.)?[a-zA-Z0-9][-a-zA-Z0-9@:%._\+~#=]{1,256}\.[a-zA-Z0-9()]{2,6}\b([-a-zA-Z0-9()@:%_\+.~#?&//=]*)$/i;
        if (domainPattern.test(trimmed)) {
          return 'https://' + trimmed;
        }
        return trimmed;
      }

      function showError(message) {
        input.classList.add('input-error');
        errorMsgText.textContent = message;
        errorMsg.classList.add('visible');
        input.setAttribute('aria-invalid', 'true');
        input.focus();
      }

      function clearError() {
        input.classList.remove('input-error');
        errorMsg.classList.remove('visible');
        input.removeAttribute('aria-invalid');
      }

      // ==========================================================================
      // QR Code Generator
      // ==========================================================================
      function generateQrCode(text) {
        if (typeof QRious === 'undefined') {
          showToast('QR code engine failed to load. Check internet connection.', true);
          return;
        }

        try {
          // Generate at high internal resolution (600x600) for razor-sharp display & print
          currentQrInstance = new QRious({
            element: qrCanvas,
            value: text,
            size: 600,
            level: 'H', // High error correction level (30%)
            foreground: '#0f172a',
            background: '#ffffff'
          });

          // Update ARIA & Caption
          qrCanvas.setAttribute('aria-label', `QR code representing: ${text}`);
          qrCaption.textContent = text;
          qrCaption.title = text;

          // Reveal preview section with animation
          previewSection.classList.add('active');
          qrContainer.classList.remove('animate-pop');
          void qrContainer.offsetWidth; // Trigger reflow for re-triggering animation
          qrContainer.classList.add('animate-pop');

          // Smooth scroll to preview on small screens if needed
          if (window.innerWidth < 640) {
            previewSection.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
          }

        } catch (err) {
          console.error('QR Generation failed:', err);
          showToast('Could not generate QR code. Content may be too long.', true);
        }
      }

      // ==========================================================================
      // Download & Export Handlers
      // ==========================================================================
      function downloadPng() {
        if (!currentQrInstance) return;

        try {
          const dataUrl = qrCanvas.toDataURL('image/png');
          const safeName = 'qr-code-' + Date.now() + '.png';
          const link = document.createElement('a');
          link.download = safeName;
          link.href = dataUrl;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          showToast('PNG image downloaded!');
        } catch (err) {
          console.error('PNG download error:', err);
          showToast('Failed to download image.', true);
        }
      }

      function downloadPdf() {
        if (!currentQrInstance) return;

        if (!window.jspdf || !window.jspdf.jsPDF) {
          showToast('PDF library is unavailable.', true);
          return;
        }

        try {
          const { jsPDF } = window.jspdf;
          const doc = new jsPDF({
            orientation: 'portrait',
            unit: 'mm',
            format: 'a4'
          });

          const imgData = qrCanvas.toDataURL('image/png');
          const valueText = input.value.trim();

          // A4 dimensions: 210 x 297 mm
          const pageWidth = doc.internal.pageSize.getWidth();
          const qrSize = 100; // 100x100 mm QR graphic
          const qrX = (pageWidth - qrSize) / 2;
          const qrY = 65;

          // Header Title
          doc.setFont('helvetica', 'bold');
          doc.setFontSize(22);
          doc.setTextColor(15, 23, 42); // slate-900
          doc.text('QR Code', pageWidth / 2, 40, { align: 'center' });

          // Subtitle
          doc.setFont('helvetica', 'normal');
          doc.setFontSize(10);
          doc.setTextColor(100, 116, 139); // slate-500
          const truncatedCaption = valueText.length > 60 ? valueText.slice(0, 57) + '...' : valueText;
          doc.text(truncatedCaption, pageWidth / 2, 50, { align: 'center' });

          // Draw subtle decorative border around QR code
          doc.setDrawColor(226, 232, 240); // slate-200
          doc.setLineWidth(0.5);
          doc.roundedRect(qrX - 5, qrY - 5, qrSize + 10, qrSize + 10, 4, 4);

          // Add High-Res QR Image
          doc.addImage(imgData, 'PNG', qrX, qrY, qrSize, qrSize);

          // Footer info
          doc.setFontSize(9);
          doc.setTextColor(148, 163, 184); // slate-400
          const dateString = new Date().toLocaleDateString(undefined, {
            year: 'numeric',
            month: 'long',
            day: 'numeric'
          });
          doc.text(`Generated on ${dateString}`, pageWidth / 2, qrY + qrSize + 25, { align: 'center' });

          // Save file
          doc.save('qr-code-' + Date.now() + '.pdf');
          showToast('PDF document downloaded!');
        } catch (err) {
          console.error('PDF generation error:', err);
          showToast('Failed to create PDF.', true);
        }
      }

      async function copyToClipboard() {
        if (!currentQrInstance) return;

        if (!navigator.clipboard) {
          showToast('Clipboard API not supported in this browser.', true);
          return;
        }

        try {
          qrCanvas.toBlob(async (blob) => {
            if (!blob) {
              showToast('Could not convert QR code.', true);
              return;
            }

            try {
              const item = new ClipboardItem({ 'image/png': blob });
              await navigator.clipboard.write([item]);
              showToast('QR code copied to clipboard!');
            } catch (err) {
              console.warn('Clipboard write error:', err);
              // Fallback for browsers that don't support copying image blobs directly
              showToast('Direct image copy unsupported. Please use Download.', true);
            }
          }, 'image/png');
        } catch (err) {
          console.error('Copy failed:', err);
          showToast('Failed to copy to clipboard.', true);
        }
      }

      // ==========================================================================
      // Event Listeners
      // ==========================================================================
      
      // Form submit (handles Enter key & button tap)
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        clearError();

        const rawValue = input.value;
        const normalized = normalizeContent(rawValue);

        if (!normalized) {
          showError('Please enter a URL or text to generate a QR code.');
          return;
        }

        // Update input if auto-prefixed
        if (normalized !== rawValue && normalized.startsWith('https://')) {
          input.value = normalized;
        }

        generateQrCode(normalized);
      });

      // Clear button behavior
      input.addEventListener('input', () => {
        clearError();
        if (input.value.trim().length > 0) {
          clearBtn.classList.add('visible');
        } else {
          clearBtn.classList.remove('visible');
        }
      });

      clearBtn.addEventListener('click', () => {
        input.value = '';
        clearBtn.classList.remove('visible');
        clearError();
        input.focus();
      });

      // Action button listeners
      downloadPngBtn.addEventListener('click', downloadPng);
      downloadPdfBtn.addEventListener('click', downloadPdf);
      copyBtn.addEventListener('click', copyToClipboard);

      // Keyboard accessibility: Escape clears error or clears input
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          if (input.value) {
            input.value = '';
            clearBtn.classList.remove('visible');
            clearError();
          }
        }
      });

    })();
  </script>
</body>
</html>
